# Сборка сайта в Coolify (nixpacks).
#
# Node берётся из пакетов nix, а их снимок nixpacks держит свой. На
# 21.10.2026 он был от апреля 2025: сайт работал на Node 22.11.0 (ноябрь
# 2024) без восьми выпусков с исправлениями безопасности, хотя
# sanitize-html требует не ниже 22.12. Поэтому снимок закреплён здесь —
# ветка nixos-26.05 на 20.10.2026, в ней Node 22.23.3.
#
# Обновлять после выпусков безопасности Node и раз в пару месяцев: взять
# свежий коммит ветки nixos-26.05 и проверить версию Node в
# pkgs/development/web/nodejs/v22.nix. Выкладка безопасна: Coolify
# заменяет контейнер, только когда новый отвечает на /api/live.
[phases.setup]
nixpkgsArchive = "cd4ea8d57de16f4810bc5f14207bac45fbf19f67"
